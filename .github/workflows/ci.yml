name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ── Format check ──────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features -- -D warnings

  # ── Tests (Linux, macOS, Windows) ─────────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Deliberately run on the default stack: the preprocessor's recursion
      # limit is set low enough to return an error rather than overflow, and
      # raising RUST_MIN_STACK here would hide a regression in that.
      - name: Run tests
        run: cargo test --workspace --all-features

  # ── no_std build ──────────────────────────────────────────
  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p asm-rs --no-default-features --features "x86,x86_64,arm,aarch64,riscv" --target thumbv7em-none-eabihf

  # ── WASM build + tests ───────────────────────────────────
  wasm:
    name: WASM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI and the wasm-bindgen crate share an unstable bindgen schema and
      # must match exactly, so take the version straight from Cargo.lock.
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/, "", $3); print $3; exit}' Cargo.lock)
          test -n "$version" || { echo "wasm-bindgen not found in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
      - name: Run WASM tests
        env:
          WASM_BINDGEN_TEST_ONLY_NODE: "1"
        run: cargo test -p asm-rs --target wasm32-unknown-unknown --test wasm_integration --features "x86,x86_64,arm,aarch64,riscv"

  # ── Benchmarks (compile check only) ──────────────────────
  bench:
    name: benchmarks (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --all-features --no-run

  # ── Documentation build ──────────────────────────────────
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  # ── Publish dry-run ──────────────────────────────────────
  publish-check:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p asm-rs --dry-run

  # ── Feature subset builds ────────────────────────────────
  features:
    name: feature subsets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "x86_64"
          - "x86"
          - "aarch64"
          - "arm"
          - "riscv"
          - "x86_64,avx,avx512"
          - "aarch64,neon,sve"
          - "riscv,riscv_f,riscv_v"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p asm-rs --no-default-features --features "std,${{ matrix.features }}"

  # ── MSRV check ────────────────────────────────────────────
  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # ── Fuzzing (smoke run) ──────────────────────────────────
  # The fuzz targets assert the assembler never panics on arbitrary input.
  # A short run on every PR catches regressions that unit tests miss; longer
  # campaigns are expected to run out of band.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # cargo-fuzz is not in install-action's tool manifest, so build it from
      # source; rust-cache keeps the registry warm between runs.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each target briefly
        working-directory: fuzz
        env:
          # LeakSanitizer reports ~550 bytes of one-time runtime/decoder init on
          # the empty unit libFuzzer runs first, before any target code executes.
          # It has to be switched off in the ASan runtime: libFuzzer's own
          # -detect_leaks=0 only suppresses its between-runs check, not the
          # sanitizer's. cargo-fuzz appends its detect_odr_violation=0 to this.
          ASAN_OPTIONS: detect_leaks=0
        run: |
          # fuzz_differential is listed first: it checks the assembler's output
          # against independent decoders, so it catches machine code that is
          # well-formed but means the wrong thing — which the panic-only
          # targets cannot see.
          for target in fuzz_differential fuzz_x86_64 fuzz_arm fuzz_aarch64 fuzz_riscv; do
            echo "::group::$target"
            cargo fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  # ── Supply chain ─────────────────────────────────────────
  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # ── Code coverage ────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Check coverage threshold
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 80
