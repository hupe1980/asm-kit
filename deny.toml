# cargo-deny configuration — supply-chain policy for asm-kit.
#
# The crate ships zero runtime dependencies by default (serde is optional), so
# the policy here is deliberately strict: anything that would introduce a
# transitive dependency, an incompatible licence, or a known advisory into a
# security-tooling library should fail CI rather than land quietly.

[graph]
all-features = true

[advisories]
# Any unmaintained or vulnerable crate in the tree is a build failure.
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive licences only — asm-kit is MIT OR Apache-2.0 and is meant to be
# embeddable without licence review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
