[package]
name = "asm_kit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Reference decoders for the differential target. Asserting "does not panic"
# cannot catch machine code that is well-formed but means the wrong thing, so
# the differential target checks our output against independent decoders.
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel"] }
bad64 = "0.12"
riscv-decode = "0.2"

[dependencies.asm-kit]
path = "../crates/asm-kit"
features = ["std", "x86", "x86_64", "arm", "aarch64", "riscv", "riscv_f"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_differential"
path = "fuzz_targets/fuzz_differential.rs"
doc = false

[[bin]]
name = "fuzz_x86_64"
path = "fuzz_targets/fuzz_x86_64.rs"
doc = false

[[bin]]
name = "fuzz_arm"
path = "fuzz_targets/fuzz_arm.rs"
doc = false

[[bin]]
name = "fuzz_aarch64"
path = "fuzz_targets/fuzz_aarch64.rs"
doc = false

[[bin]]
name = "fuzz_riscv"
path = "fuzz_targets/fuzz_riscv.rs"
doc = false
